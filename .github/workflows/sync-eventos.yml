name: Sinkronisasi jadwal dari FutbolLibreTV

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-diaries
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ambil diaries.json dari FutbolLibreTV
        run: node scripts/sync-eventos.mjs

      - name: Simpan perubahan ke GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add eventos.json

          if git diff --cached --quiet; then
            echo 'Tidak ada perubahan jadwal.'
            exit 0
          fi

          git commit -m 'sync: update schedule from FutbolLibreTV'
          git push
