name: Update football agenda

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "scripts/update_agenda.py"
      - ".github/workflows/update-agenda.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build agenda.json from diaries.json
        run: python scripts/update_agenda.py

      - name: Commit updated agenda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agenda.json
          git diff --cached --quiet || git commit -m "Auto update agenda from diaries.json"
          git push
